<script>
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FX=()=>+CFG().fx||0,BC=()=>CFG().base||'USD',OC=()=>BC()==='USD'?'ARS':'USD';
const fm=(n,c)=>(c==='USD'?'US$ ':'$ ')+(+n||0).toLocaleString('es-AR',{maximumFractionDigits:c==='USD'?2:0});
const money=n=>fm(n,BC());
const toBase=(a,cur,fx)=>cur===BC()?a:(BC()==='USD'?a/fx:a*fx);
const fromBase=(n,cur,fx)=>cur===BC()?n:(BC()==='USD'?n*fx:n/fx);
const curName=c=>c==='ARS'?'pesos':'dólares';
const fdate=d=>d?d.slice(0,10).split('-').reverse().join('/'):'';
let db=(()=>{try{return JSON.parse(localStorage.getItem('cel_db'))}catch(e){}})()||{phones:[],acc:[],clients:[],sales:[]};
const COLS=['phones','acc','clients','sales','debts','moves','cfg'];
let cloud=null,q=Promise.resolve(),synced=Object.fromEntries(COLS.map(c=>[c,{}]));
COLS.forEach(c=>db[c]=db[c]||[]);
const CFG=()=>db.cfg[0]||(db.cfg[0]={id:'main'});
const sum=(a,f)=>a.reduce((t,x)=>t+f(x),0);
const saldo=d=>d.total-sum(d.pays||[],p=>p.amount);
const pend=k=>db.debts.filter(d=>d.kind===k&&saldo(d)>0.5);
const pcost=p=>(+p.cost||0)+sum(p.repairs||[],r=>r.amount);
const stockCost=()=>sum(db.phones.filter(p=>p.status!=='Vendido'),pcost)+sum(db.acc,a=>a.stock*a.cost);
const senas=()=>sum(db.phones.filter(p=>p.status==='Reservado'&&p.res),p=>p.res.amount);
const addDays=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const daysSince=d=>d?Math.max(0,Math.floor((new Date(today()+'T12:00:00')-new Date(d.slice(0,10)+'T12:00:00'))/864e5)):0;
const waNum=t=>{const d=String(t||'').replace(/\D/g,'');return d?(d.startsWith('54')?d:'549'+d.replace(/^0+/,'')):''};
const TERMS='La garantía cubre fallas de funcionamiento del equipo. No cubre golpes, humedad, equipos abiertos o reparados por terceros, ni software modificado.';
const cajaBase=()=>sum(db.sales,s=>s.profit)-stockCost()-sum(pend('cobrar'),saldo)+sum(pend('pagar'),saldo)-sum(db.moves,m=>m.amount)+senas();
const caja=()=>(CFG().ajuste||0)+cajaBase();
const setSync=(t,ok)=>{const e=$('#sync');e.textContent=t;e.style.color=ok?'#0b7a64':'#64748b'};
const keep=()=>localStorage.setItem('cel_db',JSON.stringify(db));
const save=()=>{keep();push()};
const wErr=e=>{setSync('Error al sincronizar',0);toast(e&&e.code==='permission-denied'?'Tu usuario solo puede ver los datos. Revisá que tu email esté habilitado en las reglas.':'No se pudo sincronizar. Revisá la conexión.','err')};
const eq=(a,b)=>{const k=Object.keys(a);return k.length===Object.keys(b).length&&k.every(x=>a[x]===b[x])};
function push(cols=COLS){
  if(!cloud)return;
  for(const c of cols){
    const now={};db[c].forEach(r=>now[r.id]=JSON.stringify(r));
    for(const id in now)if(synced[c][id]!==now[id]){synced[c][id]=now[id];const r=JSON.parse(now[id]);q=q.then(()=>cloud.set(c+'/'+id,r)).catch(wErr)}
    for(const id in synced[c])if(!(id in now)){delete synced[c][id];q=q.then(()=>cloud.del(c+'/'+id)).catch(wErr)}
  }
}
let started=false;
function startSync(){
  if(started)return;started=true;setSync('Conectando...',0);
  const c=window.cloudAPI,init={};let ready=false;
  const apply=(col,recs)=>{const j={};recs.forEach(r=>j[r.id]=JSON.stringify(r));if(eq(j,synced[col]))return false;synced[col]=j;db[col]=recs;return true};
  COLS.forEach(col=>c.watch(col,(recs,fromCache)=>{
    if(fromCache)return;
    if(!ready){
      init[col]=recs;if(COLS.some(k=>!init[k]))return;
      ready=true;cloud=c;setTimeout(()=>autoFx(),1500);
      if(COLS.every(k=>!init[k].length)){push();setSync('Sincronizado',1);return}
      COLS.forEach(k=>apply(k,init[k]));
    }else if(!apply(col,recs))return;
    db.sales.sort((a,b)=>b.id.localeCompare(a.id));keep();setSync('Sincronizado',1);
    if(!$('#modal').innerHTML&&!/INPUT|SELECT/.test(document.activeElement.tagName))render();
  },()=>setSync('Sin conexión',0)));
}
async function doLogin(e){e.preventDefault();$('#lerr').textContent='';try{await cloudAPI.login($('#lem').value.trim(),$('#lpw').value)}catch(x){$('#lerr').textContent='Email o contraseña incorrectos.'}}
async function salir(){if(!confirm('¿Cerrar sesión? Se borran los datos guardados en este dispositivo (siguen en la nube).'))return;await cloudAPI.logout();localStorage.removeItem('cel_db');location.reload()}
let booted=false;
function boot(){
  if(booted)return;booted=true;lucide.createIcons();
  setInterval(()=>autoFx(),6e5);document.addEventListener('visibilitychange',()=>{if(!document.hidden)autoFx()});
  if(!window.cloudAPI){render();autoFx();return}
  cloudAPI.onAuth(u=>{if(u){$('#login').classList.add('hidden');render();startSync()}else $('#login').classList.remove('hidden')});
}
setSync('Guardado en este dispositivo',0);
const ui={tab:'dash',inv:'phones',q:'',st:'',cq:'',sq:'',cart:[],cid:'',cin:'',pay:'Efectivo',paid:'',cuo:'',venc:'',cur:'',fxs:'',canje:[],war:''};
const ST=['Disponible','Reservado','Vendido'],COND=['Nuevo','Usado','Grado A','Grado B'],PAY=['Efectivo','Transferencia','Tarjeta','USDT','Otro'];
const TABS=[['dash','Resumen','layout-dashboard'],['inv','Inventario','smartphone'],['cli','Clientes','users'],['pos','Ventas','shopping-cart'],['fin','Deudas','banknote']];
const cl=c=>c.name+(c.dni?' - '+c.dni:'');
const setH=(s,h)=>{$(s).innerHTML=h;lucide.createIcons()};
const go=k=>{ui.tab=k;render()};

function nav(){
  const h=m=>TABS.map(([k,l,i])=>`<button onclick="go('${k}')" class="${m?'flex flex-col items-center gap-0.5 py-2 text-[11px]':'flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm w-full text-left'} font-semibold ${ui.tab===k?(m?'text-[#3346d3]':'bg-[#eceefc] text-[#3346d3]'):'text-slate-500 hover:text-slate-800'}"><i data-lucide="${i}"></i>${l}</button>`).join('');
  $('#sn').innerHTML=h(0);$('#bn').innerHTML=h(1);
}
const head=(t,a='')=>`<div class="flex items-center justify-between mb-5 gap-2 flex-wrap"><h1 class="text-2xl font-extrabold">${t}</h1><div class="flex gap-2">${a}</div></div>`;
let tt;function toast(m,e){const t=$('#toast');t.innerHTML=`<div class="px-4 py-2.5 rounded-lg text-sm font-semibold text-white shadow-lg ${e?'bg-red-600':'bg-slate-900'}">${m}</div>`;clearTimeout(tt);tt=setTimeout(()=>t.innerHTML='',2800)}
const closeM=()=>$('#modal').innerHTML='';
function modal(title,body,onSave){
  $('#modal').innerHTML=`<div class="fixed inset-0 bg-slate-900/50 z-50 flex items-end md:items-center justify-center md:p-4" onclick="if(event.target===this)closeM()"><form id="mf" class="bg-white w-full md:max-w-lg rounded-t-2xl md:rounded-2xl max-h-[92vh] overflow-y-auto p-5"><div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">${title}</h3><button type="button" class="btn-i" onclick="closeM()"><i data-lucide="x"></i></button></div>${body}${onSave?'<div class="flex justify-end gap-2 mt-5"><button type="button" class="btn" onclick="closeM()">Cancelar</button><button class="btn btn-p">Guardar</button></div>':''}</form></div>`;
  lucide.createIcons();
  if(onSave)$('#mf').onsubmit=e=>{e.preventDefault();onSave(Object.fromEntries(new FormData(e.target)))};
}
const fld=(n,l,v='',t='text',o={})=>`<label class="block ${o.full?'col-span-2':''}"><span class="text-slate-500 text-xs font-semibold">${l}</span>${t==='select'?`<select name="${n}" class="inp mt-1">${o.opts.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('')}</select>`:`<input name="${n}" type="${t}" value="${esc(v)}" class="inp mt-1" ${o.req?'required':''} ${t==='number'?'min="0" step="any"':''} ${o.att||''}>`}</label>`;
const grid=h=>`<div class="grid grid-cols-2 gap-3">${h}</div>`;

/* ---------- VISTAS ---------- */
const V={};
V.dash=()=>{
  const ph=db.phones.filter(p=>p.status!=='Vendido');
  const sa=db.acc.filter(x=>!x.incl);
  const nAcc=sa.reduce((a,x)=>a+x.stock,0);

  `<button class="text-left [&>div]:h-full" onclick="lowInfo()">`+card('Stock bajo',low.length,low.length?'Tocá para ver cuáles':'Todo en orden','alert-triangle',low.length?'!bg-[#fdf0d1] !border-[#f0d38a]':'')+`</button>`+`</div><div class="grid md:grid-cols-3 gap-3 mt-3">`+
  `<button class="text-left [&>div]:h-full" onclick="ajusteForm()">`+card('Plata para invertir',money(caja())+`<div class="text-lg font-bold opacity-90 mt-0.5">`+(FX()?'= '+fm(fromBase(caja(),OC(),FX()),OC()):'Cargá el dólar para ver la otra moneda')+`</div>`,'Estimada. Tocá para ajustarla','banknote','!bg-[#0b7a64] !text-white !border-[#0b7a64]')+`</button>`+
  card('Me deben',money(sum(pend('cobrar'),saldo)),pend('cobrar').length+' cuentas'+(vencidas?' - '+vencidas+' vencidas':''),'arrow-down-left',vencidas?'!bg-[#fde2e2] !border-[#f0b3b3]':'')+
  card('Debo a proveedores',money(sum(pend('pagar'),saldo)),pend('pagar').length+' cuentas','arrow-up-right')+`</div>
  <div class="grid gap-3 mt-3">${revisar()}
  <div class="card p-4"><h2 class="font-bold mb-2">Últimas ventas</h2>${db.sales.length?db.sales.slice(0,6).map(s=>saleRow(s)).join(''):'<p class="text-sm text-slate-500">Todavía no registraste ventas. Andá a Ventas para cargar la primera.</p>'}</div></div>`;

`);
  }else{
    const r=db.acc.filter(a=>!q||(a.name+a.cat).toLowerCase().includes(q));

    setH('#list',`<div class="card overflow-x-auto"><table class="w-full"><thead><tr><th>Accesorio</th><th>Stock</th><th class="hidden md:table-cell">Costo</th><th>Venta</th><th></th></tr></thead><tbody>${r.map(a=>`<tr><td><div class="font-semibold">${esc(a.name)} ${a.incl?'<span class="chip" style="background:#e6e9fb;color:#3346d3">Se entrega</span>':''}</div><div class="text-xs text-slate-500">${esc(a.cat)}</div></td><td>${a.stock<=a.min?`<span class="chip" style="background:#fde2e2;color:#a11d1d">${a.stock} - bajo</span>`:a.stock}</td><td class="hidden md:table-cell">${money(a.cost)}</td><td class="font-semibold">${a.incl?'-':money(a.price)}</td><td class="text-right whitespace-nowrap"><button class="btn-i" title="Editar" onclick="accForm('${a.id}')"><i data-lucide="pencil"></i></button><button class="btn-i" title="Eliminar" onclick="del('acc','${a.id}')"><i data-lucide="trash-2"></i></button></td></tr>`).join('')}</tbody></table></div>`);
  }
}

V.pos=()=>head('Nueva venta',`<button class="btn" onclick="fxForm()"><i data-lucide="dollar-sign"></i>${fxLabel()}</button>`)+`<div class="grid lg:grid-cols-5 gap-4">
<div class="lg:col-span-3 space-y-3">
<div class="card p-4"><div class="text-xs font-semibold text-slate-500 mb-1">Cliente</div><div class="flex gap-2"><input id="cin" list="cl" class="inp" placeholder="Buscar por nombre o DNI (vacío = consumidor final)" value="${esc(ui.cin)}" oninput="pickCli(this.value)"><button class="btn" title="Cliente nuevo" onclick="cliForm('',1)"><i data-lucide="user-plus"></i></button></div><datalist id="cl">${db.clients.map(c=>`<option value="${esc(cl(c))}">`).join('')}</datalist></div>
<div class="card p-4"><div class="text-xs font-semibold text-slate-500 mb-1">Producto (escaneá o escribí el IMEI, modelo o accesorio)</div><input class="inp" placeholder="Buscar producto" value="${esc(ui.sq)}" oninput="ui.sq=this.value;posRes()" onkeydown="if(event.key==='Enter')scan()"><div id="res" class="mt-2"></div></div></div>
<div class="lg:col-span-2"><div class="card p-4 lg:sticky lg:top-6" id="cart"></div></div></div>
<h2 class="font-bold mt-8 mb-3">Últimas ventas</h2><div class="card px-4" id="hist"></div>`;
const pickCli=v=>{ui.cin=v;const c=db.clients.find(c=>cl(c)===v);ui.cid=c?c.id:''};
function scan(){const p=db.phones.find(p=>p.imei===ui.sq.trim()&&p.status!=='Vendido');if(p&&!ui.cart.some(c=>c.id===p.id)){addCart('p',p.id);ui.sq='';document.querySelector('#res').previousElementSibling.value=''}}
function posRes(){
  const q=ui.sq.toLowerCase().trim(),inCart=id=>ui.cart.find(c=>c.id===id);

function addCart(t,id){
  if(t==='p'){const p=db.phones.find(x=>x.id===id);if(p.res)toast('Reservado por '+p.res.party+': su seña se descuenta del total');else if(p.status==='Reservado')toast('Ojo: este equipo figura como reservado');ui.cart.push({t,id,name:p.model+' '+p.cap+' (IMEI '+p.imei+')',m:p.model+' '+p.cap,qty:1,price:p.price,cost:pcost(p),sena:p.res?p.res.amount:0,resParty:p.res?p.res.party:'',resInfo:p.res?{...p.res}:null})}
  else{const a=db.acc.find(x=>x.id===id),c=ui.cart.find(x=>x.id===id);if(c){if(c.qty<a.stock)c.qty++}else ui.cart.push({t,id,name:a.name,qty:1,price:a.incl?0:a.price,cost:a.cost,incl:!!a.incl})}

}
const totals=()=>({total:ui.cart.reduce((a,c)=>a+c.price*c.qty,0),profit:ui.cart.reduce((a,c)=>a+(c.price-c.cost)*c.qty,0)});
function qty(i,d){const c=ui.cart[i];if(c.t==='p')return;const a=db.acc.find(x=>x.id===c.id);c.qty=Math.max(1,Math.min(a.stock,c.qty+d));posRes();posCart()}

  <div class="py-2.5 border-t"><div class="flex justify-between items-center"><span class="text-sm font-semibold">Equipos en canje</span><button class="btn !py-1" onclick="canjeForm()"><i data-lucide="repeat"></i>Agregar</button></div>${ui.canje.map((c,i)=>`<div class="flex justify-between gap-2 text-sm mt-2"><div><div>${esc(c.model)} ${esc(c.cap)}</div><div class="text-xs text-slate-500">IMEI ${esc(c.imei)}${c.price?' - margen est. '+money(c.price-c.value):''}</div></div><div class="whitespace-nowrap font-semibold">-${money(c.value)}<button class="btn-i !p-1" onclick="ui.canje.splice(${i},1);posCart()"><i data-lucide="x"></i></button></div></div>`).join('')}</div>
  <div class="border-t mt-2 pt-3 space-y-2"><label class="block text-xs font-semibold text-slate-500">Método de pago<select class="inp mt-1" onchange="ui.pay=this.value">${PAY.map(p=>`<option ${ui.pay===p?'selected':''}>${p}</option>`).join('')}</select></label>
  <div class="grid grid-cols-2 gap-2"><label class="block text-xs font-semibold text-slate-500">Te pagan en<select class="inp mt-1" onchange="ui.cur=this.value;posCart()"><option value="USD" ${cur==='USD'?'selected':''}>Dólares</option><option value="ARS" ${cur==='ARS'?'selected':''}>Pesos</option></select></label>${conv?`<label class="block text-xs font-semibold text-slate-500">Dólar de esta venta<input type="number" min="0" class="inp mt-1" value="${fx||''}" onchange="ui.fxs=this.value;posCart()"></label>`:''}</div>
  ${conv&&!fx?'<p class="text-xs text-red-600 font-semibold">Cargá la cotización del dólar para convertir.</p>':''}${conv&&fx?`<div class="flex justify-between text-sm"><span>Total a cobrar</span><b>${fm(toPay,cur)}</b></div>`:''}
  <label class="block text-xs font-semibold text-slate-500">Cobrado ahora en ${curName(cur)} (vacío = cobrás todo)<input type="number" min="0" class="inp mt-1" value="${ui.paid}" onchange="ui.paid=this.value;posCart()"></label>
  ${pd<due?`<div class="grid grid-cols-2 gap-2"><label class="block text-xs font-semibold text-slate-500">Cuotas<input type="number" min="1" class="inp mt-1" value="${ui.cuo}" onchange="ui.cuo=this.value"></label><label class="block text-xs font-semibold text-slate-500">Próximo vencimiento<input type="date" class="inp mt-1" value="${ui.venc}" onchange="ui.venc=this.value"></label></div><div class="flex justify-between text-sm"><span>Queda debiendo</span><b>${money(due-pd)}</b></div>`:''}
  <label class="block text-xs font-semibold text-slate-500">Garantía (días)<input type="number" min="0" class="inp mt-1" value="${ui.war===''?(CFG().war??30):ui.war}" onchange="ui.war=this.value"></label>
  <div class="flex justify-between text-sm"><span>Ganancia neta</span><b class="${profit<0?'text-red-600':'text-[#0b7a64]'}">${money(profit)}</b></div>
  ${cv?`<div class="flex justify-between text-sm"><span>Canje</span><b>-${money(cv)}</b></div>`:''}${sn?`<div class="flex justify-between text-sm"><span>Seña aplicada</span><b>-${money(sn)}</b></div>`:''}
  <div class="flex justify-between text-lg font-extrabold"><span>Total</span><span>${money(total)}</span></div>
  ${cv||sn?`<div class="flex justify-between text-sm"><span>A cobrar ahora</span><b>${money(due)}</b></div>`:''}
  <button class="btn btn-p w-full justify-center !py-3 disabled:opacity-40" ${ui.cart.length?'':'disabled'} onclick="confirmSale()"><i data-lucide="check"></i>Confirmar venta</button></div>`);
}
function confirmSale(){
  if(!ui.cart.length)return;
  if(ui.cin&&!ui.cid)return toast('Elegí un cliente de la lista o creá uno con el botón de usuario','err');
  for(const c of ui.cart){
    if(c.t==='p'){const p=db.phones.find(x=>x.id===c.id);if(!p||p.status==='Vendido')return toast(c.name+' ya no está disponible','err')}
    else{const a=db.acc.find(x=>x.id===c.id);if(!a||a.stock<c.qty)return toast('Stock insuficiente: '+c.name,'err')}
  }
  const {total,profit}=totals(),cli=db.clients.find(x=>x.id===ui.cid);
  const cv=sum(ui.canje,c=>c.value),sn=sum(ui.cart,c=>c.sena||0);
  if(cv+sn>total+0.005)return toast('El canje y la seña superan el total de la venta','err');
  if(ui.canje.length&&!cli)return toast('Para recibir un equipo en canje elegí un cliente','err');
  const due=total-cv-sn,pc=payCalc(due),pd=pc.pd;
  if(pc.conv&&!pc.fx)return toast('Cargá la cotización del dólar','err');
  if(pd<due&&!cli)return toast('Para dejar saldo pendiente elegí un cliente','err');
  const sid=uid(),war=ui.war===''?(CFG().war??30):Math.max(0,+ui.war||0);
  ui.cart.forEach(c=>{if(c.t==='p'){const p=db.phones.find(x=>x.id===c.id);p.status='Vendido';delete p.res}else db.acc.find(x=>x.id===c.id).stock-=c.qty});
  const cj=ui.canje.map(c=>{const id=uid();db.phones.push({id,model:c.model,imei:c.imei,cap:c.cap,bat:c.bat,color:c.color,cond:c.cond,cost:c.value,price:c.price,supplier:'Canje - '+cli.name,date:today(),status:'Disponible',canje:true,sid,check:c.check,note:c.note});return {id,name:(c.model+' '+c.cap).trim(),imei:c.imei,value:c.value}});
  db.sales.unshift({id:sid,date:today(),cid:ui.cid,cname:cli?cli.name:'Consumidor final',items:ui.cart.map(c=>({...c})),pay:ui.pay,total,profit,paid:pd,canje:cj,canjeVal:cv,sena:sn,war,warEnd:war?addDays(today(),war):'',cur:pc.cur,fx:pc.conv?pc.fx:0});
  if(pd<due)db.debts.push({id:uid(),kind:'cobrar',party:cli.name,cid:cli.id,sid,desc:'Venta del '+fdate(today()),total:due-pd,cuotas:+ui.cuo||'',venc:ui.venc,date:today(),pays:[]});
  save();ui.cart=[];ui.cid='';ui.cin='';ui.sq='';ui.paid='';ui.cuo='';ui.venc='';ui.fxs='';ui.canje=[];ui.war='';render();toast('Venta registrada');receipt(sid);
}
function anular(id){
  const s=db.sales.find(x=>x.id===id),cj=(s.canje||[]).map(c=>db.phones.find(p=>p.id===c.id)).filter(Boolean);
  if(cj.some(p=>p.status!=='Disponible'))return toast('No se puede anular: un equipo recibido en canje ya se vendió o está reservado','err');
  if(!confirm('¿Anular esta venta? Los equipos vuelven a su estado anterior, los accesorios recuperan su stock y los equipos recibidos en canje se quitan del inventario.'))return;
  s.items.forEach(i=>{if(i.t==='p'){const p=db.phones.find(x=>x.id===i.id);if(p){if(i.resInfo){p.status='Reservado';p.res=i.resInfo}else p.status='Disponible'}}else{const a=db.acc.find(x=>x.id===i.id);if(a)a.stock+=i.qty}});
  const ids=cj.map(p=>p.id);db.phones=db.phones.filter(p=>!ids.includes(p.id));
  db.sales=db.sales.filter(x=>x.id!==id);db.debts=db.debts.filter(d=>d.sid!==id);save();render();toast('Venta anulada');
}

function setBrand(){const c=CFG(),n=c.name||'MiApple.Cba';$('#brand').innerHTML=`<img src="${c.logo||LOGO}" class="w-9 h-9 rounded-lg">`+esc(n);document.title=n}
function cfgForm(){
  const c=CFG();
  modal('Ajustes del negocio',`<div class="space-y-3">${fld('name','Nombre del negocio',c.name||'MiApple.Cba')}${fld('war','Garantía por defecto (días)',c.war??30,'number')}${fld('terms','Texto de garantía (sale en el comprobante)',c.terms||TERMS)}<div><span class="text-slate-500 text-xs font-semibold">Logo</span><div class="flex items-center gap-3 mt-1"><img id="lp" src="${c.logo||''}" class="w-14 h-14 rounded-xl object-cover bg-slate-100 ${c.logo?'':'hidden'}"><input type="file" accept="image/*" onchange="pickLogo(this)" class="text-sm"></div><input type="hidden" name="logo" value="${c.logo||''}"></div></div>`,d=>{Object.assign(CFG(),{name:d.name.trim(),logo:d.logo,war:d.war===''?30:+d.war,terms:d.terms.trim()});save();closeM();render();toast('Ajustes guardados')});
}
function pickLogo(i){const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,160/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);const u=cv.toDataURL('image/png');document.querySelector('[name=logo]').value=u;$('#lp').src=u;$('#lp').classList.remove('hidden')};im.src=URL.createObjectURL(f)}
function ajusteForm(){
  const c=Math.round(caja()*100)/100,bU=BC()==='USD';
  modal('Plata para invertir',`<p class="text-sm text-slate-600 mb-3">Poné cuánta plata tenés hoy, separada por moneda (efectivo, banco y USDT). La app las suma al dólar de hoy y desde ahí va actualizando el total con tus ganancias, cobros, compras de stock, pagos a proveedores, gastos y retiros. Podés volver a ajustarla cuando quieras.</p>`+grid(fld('usd','Dólares (incluye USDT)',bU?c:0,'number')+fld('ars','Pesos',bU?0:Math.round(c),'number')),d=>{
    const u=+d.usd||0,p=+d.ars||0,main=bU?u:p,other=bU?p:u;
    if(other&&!FX())return toast('Cargá primero la cotización del dólar','err');
    CFG().ajuste=main+(other?toBase(other,OC(),FX()):0)-cajaBase();
    save();closeM();render();toast('Plata ajustada');
  });
}
V.fin=()=>head('Deudas',`<button class="btn" onclick="moveForm()"><i data-lucide="minus-circle"></i>Gasto o retiro</button>`)+
  `<div class="grid lg:grid-cols-2 gap-4">${debtCol('cobrar','Me deben','Clientes que pagan en cuotas o con saldo')}${debtCol('pagar','Debo a proveedores','Lo que todavía tenés que pagar')}</div>${movesHtml()}`;
function debtCol(k,t,sub){
  const all=db.debts.filter(d=>d.kind===k),open=all.filter(d=>saldo(d)>0.5).sort((a,b)=>(a.venc||'9').localeCompare(b.venc||'9')),done=all.filter(d=>saldo(d)<=0.5);
  return `<div><div class="flex justify-between items-end mb-2 gap-2"><div><h2 class="font-bold text-lg">${t}</h2><div class="text-xs text-slate-500">${sub}</div></div><button class="btn btn-p" onclick="debtForm('${k}')"><i data-lucide="plus"></i>Agregar</button></div>
  <div class="card p-4 mb-3"><div class="text-xs text-slate-500">Total pendiente</div><div class="text-2xl font-extrabold">${money(sum(open,saldo))}</div></div>
  <div class="space-y-2">${open.length?open.map(debtCard).join(''):`<div class="card p-6 text-center text-sm text-slate-500">${k==='cobrar'?'Nadie te debe plata por ahora.':'No le debés a ningún proveedor.'}</div>`}
  ${done.length?`<details class="text-sm text-slate-500 pt-2"><summary class="cursor-pointer">Saldadas (${done.length})</summary><div class="space-y-2 mt-2">${done.map(debtCard).join('')}</div></details>`:''}</div></div>`;
}
function debtCard(d){
  const s=saldo(d),pg=d.total-s,late=s>0.5&&d.venc&&d.venc<today(),cq=+d.cuotas>0?d.total/d.cuotas:0;
  return `<div class="card p-4"><div class="flex justify-between gap-2"><div><div class="font-bold">${esc(d.party)}</div><div class="text-xs text-slate-500">${esc(d.desc)}</div></div><div class="text-right whitespace-nowrap"><div class="font-extrabold">${money(s)}</div><div class="text-xs text-slate-500">de ${money(d.total)}</div></div></div>
  <div class="h-1.5 bg-slate-100 rounded mt-2"><div class="h-1.5 rounded bg-[#3346d3]" style="width:${d.total>0?Math.min(100,pg/d.total*100):0}%"></div></div>
  <div class="flex flex-wrap gap-x-3 text-xs text-slate-500 mt-2">${cq?`<span>Cuota de ${money(cq)} - pagó ${Math.floor(pg/cq+1e-6)} de ${d.cuotas}</span>`:''}${d.venc&&s>0.5?`<span class="${late?'font-bold text-red-600':''}">${late?'Vencida ':'Vence '}${fdate(d.venc)}</span>`:''}</div>
  <div class="flex justify-between items-center mt-2 pt-2 border-t"><button class="btn disabled:opacity-40" onclick="payForm('${d.id}')" ${s>0.5?'':'disabled'}><i data-lucide="check"></i>${d.kind==='cobrar'?'Registrar cobro':'Registrar pago'}</button><span class="whitespace-nowrap">${d.kind==='cobrar'&&s>0.5?`<button class="btn-i" title="Recordar por WhatsApp" onclick="recordar('${d.id}')"><i data-lucide="message-circle"></i></button>`:''}<button class="btn-i" title="Ver pagos" onclick="payHist('${d.id}')"><i data-lucide="list"></i></button><button class="btn-i" title="Editar" onclick="debtForm('${d.kind}','${d.id}')"><i data-lucide="pencil"></i></button><button class="btn-i" title="Eliminar" onclick="del('debts','${d.id}')"><i data-lucide="trash-2"></i></button></span></div></div>`;
}
function debtForm(k,id){

function payCalc(total){
  const cur=ui.cur||BC(),fx=+ui.fxs||FX(),conv=cur!==BC(),raw=ui.paid===''?null:Math.max(0,+ui.paid||0);
  const pd=raw===null?total:Math.min(total,conv?toBase(raw,cur,fx||1):raw);
  return {cur,fx,conv,raw,pd,toPay:conv&&fx?fromBase(total,cur,fx):total};
}

async function getFx(o){
  const url=o.src==='infodolar'?o.url:'https://dolarapi.com/v1/dolares/'+o.type;
  if(!url)throw 0;
  const j=await (await fetch(url)).json(),v=+j[o.side]||+j.venta;
  if(!v)throw 0;return Math.round((v+o.adj)*100)/100;
}
const fxOpts=c=>({src:c.fxSrc||'dolarapi',url:(c.fxUrl||'').trim(),type:c.fxType||'blue',side:c.fxSide||'venta',adj:+c.fxAdj||0});
async function autoFx(force){
  const c=CFG();if(!c.fxAuto)return;
  if(!force&&Date.now()-(c.fxAt||0)<6e5)return;
  try{
    const n=await getFx(fxOpts(c));
    c.fxAt=Date.now();
    if(n!==c.fx){c.fx=n;c.fxDate=today();save();softRender()}
  }catch(e){}
}

  const d=db.debts.find(x=>x.id===id),c=db.clients.find(x=>x.id===d.cid)||db.clients.find(x=>x.name===d.party)||{};
  if(!waNum(c.tel))return toast('Cargá el teléfono de '+d.party+' en Clientes','err');
  const s=saldo(d),cq=+d.cuotas>0?Math.min(s,d.total/d.cuotas):s,late=d.venc&&d.venc<today();
  const eq=x=>fm(x,BC())+(FX()?' (aprox. '+fm(fromBase(x,OC(),FX()),OC())+')':'');
  const msg='Hola '+(c.name||d.party)+', te escribo de '+(CFG().name||'MiApple.Cba')+'. '+(late?'Te recuerdo que la cuota de '+eq(cq)+' venció el '+fdate(d.venc)+'. ':d.venc?'Te recuerdo que la próxima cuota de '+eq(cq)+' vence el '+fdate(d.venc)+'. ':'Te recuerdo que tenés un saldo pendiente de '+eq(s)+'. ')+(+d.cuotas>0?'Saldo total: '+eq(s)+'. ':'')+'¡Gracias!';
  window.open('https://wa.me/'+waNum(c.tel)+'?text='+encodeURIComponent(msg),'_blank');
}
function revisar(){
  const hoy=today(),lim=addDays(hoy,7);
  const gar=db.sales.filter(s=>s.warEnd&&s.warEnd>=hoy&&s.warEnd<=lim).sort((a,b)=>a.warEnd.localeCompare(b.warEnd));
  const old=db.phones.filter(p=>p.status==='Disponible'&&daysSince(p.date)>30);
  if(!gar.length&&!old.length)return '';
  return `<div class="card p-4"><h2 class="font-bold mb-1">Para revisar</h2>${old.length?`<button class="w-full text-left flex justify-between gap-2 text-sm py-2" onclick="go('rep')"><span>${old.length} equipos llevan más de 30 días sin venderse</span><b>${money(sum(old,pcost))}</b></button>`:''}${gar.map(s=>`<button class="w-full text-left flex justify-between gap-2 text-sm py-2 border-t" onclick="receipt('${s.id}')"><span>La garantía de ${esc(s.cname)} vence el ${fdate(s.warEnd)}</span><span class="text-slate-400">Ver</span></button>`).join('')}</div>`;
}
V.rep=()=>{
  const S=db.sales,M={};
  S.forEach(s=>{const k=(s.date||'').slice(0,7);const o=M[k]=M[k]||{n:0,v:0,g:0};o.n++;o.v+=s.total;o.g+=s.profit});
  const ks=Object.keys(M).sort().reverse().slice(0,12),mx=Math.max(1,...ks.map(k=>Math.abs(M[k].g)));
  const mn=k=>{const [y,m]=k.split('-');return ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+m-1]+' '+y};
  const MO={};
  S.forEach(s=>s.items.filter(i=>i.t==='p').forEach(i=>{const k=i.m||i.name.split(' (IMEI')[0];const o=MO[k]=MO[k]||{n:0,g:0};o.n+=i.qty;o.g+=(i.price-i.cost)*i.qty}));
  const ml=Object.entries(MO).sort((a,b)=>b[1].g-a[1].g).slice(0,10);
  const st=db.phones.filter(p=>p.status!=='Vendido').map(p=>({p,d:daysSince(p.date)})).sort((a,b)=>b.d-a.d),old=st.filter(x=>x.d>30);
  return head('Reportes',`<button class="btn" onclick="go('dash')"><i data-lucide="arrow-left"></i>Volver</button>`)+
  `<div class="card p-4 mb-3"><h2 class="font-bold mb-2">Ganancia por mes</h2>${ks.length?ks.map(k=>`<div class="py-1.5 text-sm"><div class="flex flex-wrap justify-between gap-x-3"><span class="font-semibold">${mn(k)}</span><span>${M[k].n} ventas - vendiste ${money(M[k].v)} - <b class="text-[#0b7a64]">${money(M[k].g)}</b></span></div><div class="h-1.5 bg-slate-100 rounded mt-1"><div class="h-1.5 rounded bg-[#3346d3]" style="width:${Math.max(0,M[k].g)/mx*100}%"></div></div></div>`).join(''):'<p class="text-sm text-slate-500">Todavía no hay ventas registradas.</p>'}</div>
  <div class="card p-4 mb-3"><h2 class="font-bold mb-2">Modelos que más ganancia dejan</h2>${ml.length?ml.map(([k,o])=>`<div class="flex justify-between gap-3 py-1.5 border-t first:border-0 text-sm"><span>${esc(k)}</span><span class="whitespace-nowrap">${o.n} vendidos - <b class="text-[#0b7a64]">${money(o.g)}</b> (${money(o.g/o.n)} c/u)</span></div>`).join(''):'<p class="text-sm text-slate-500">Todavía no vendiste celulares.</p>'}</div>
  <div class="card p-4"><h2 class="font-bold mb-1">Equipos en stock</h2><p class="text-xs text-slate-500 mb-2">${old.length?old.length+' llevan más de 30 días ('+money(sum(old.map(x=>x.p),pcost))+' parados)':'Ninguno lleva más de 30 días.'}</p>${st.length?st.map(({p,d})=>`<div class="flex justify-between gap-3 py-1.5 border-t first:border-0 text-sm"><span>${esc(p.model)} ${esc(p.cap)} <span class="text-xs text-slate-400">${p.status}</span></span><span class="whitespace-nowrap ${d>30?'font-bold text-red-600':''}">${d} días - ${money(pcost(p))}</span></div>`).join(''):'<p class="text-sm text-slate-500">No hay celulares en stock.</p>'}</div>`;
};

/* ---------- COPIA DE SEGURIDAD ---------- */
function exportDb(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='respaldo-'+today()+'.json';a.click()}
function importDb(i){
  const f=i.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.phones||!d.acc||!d.clients||!d.sales)throw 0;if(!confirm('Esto reemplaza los datos actuales. ¿Continuar?'))return;db=d;COLS.forEach(c=>db[c]=db[c]||[]);save();render();toast('Datos importados')}catch(e){toast('El archivo no es válido','err')}};
  r.readAsText(f);
}

function render(){
  nav();setBrand();$('#main').innerHTML=V[ui.tab]();
  ({inv:invList,cli:cliList,pos:()=>{posRes();posCart();setH('#hist',db.sales.length?db.sales.slice(0,10).map(s=>saleRow(s,1)).join(''):'<p class="text-sm text-slate-500 py-4">Sin ventas registradas.</p>')}})[ui.tab]?.();
  lucide.createIcons();
}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
window.cloudDone?boot():addEventListener('cloudready',boot,{once:true});
</script>
<script type="module">
try{
  const {firebaseConfig:cfg}=await import('./config.js');
  if(cfg&&cfg.apiKey&&!cfg.apiKey.startsWith('PEGAR')){
    const V='https://www.gstatic.com/firebasejs/10.12.2/';
    const [A,Au,F]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-auth.js'),import(V+'firebase-firestore.js')]);
    const app=A.initializeApp(cfg),auth=Au.getAuth(app),fs=F.getFirestore(app);
    window.cloudAPI={
      login:(e,p)=>Au.signInWithEmailAndPassword(auth,e,p),
      logout:()=>Au.signOut(auth),
      onAuth:cb=>Au.onAuthStateChanged(auth,cb),
      set:(path,d)=>F.setDoc(F.doc(fs,path),d),
      del:path=>F.deleteDoc(F.doc(fs,path)),
      watch:(col,next,err)=>F.onSnapshot(F.collection(fs,col),sn=>next(sn.docs.map(d=>d.data()),sn.metadata.fromCache),err)
    };
  }
}catch(e){console.error(e)}
window.cloudDone=true;window.dispatchEvent(new Event('cloudready'));
</script>
